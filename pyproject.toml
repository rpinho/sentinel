[project]
name = "sentinel-detect"
version = "0.1.0"
description = "An anomaly detection and triage agent that grades itself in public."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "httpx>=0.27", "typer>=0.12", "openai>=1.40"]

[project.scripts]
sentinel = "sentinel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]
