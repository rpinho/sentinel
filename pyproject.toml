[project]
name = "sentinel-detect"
version = "0.1.0"
description = "An anomaly detection and triage agent that grades itself in public."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pytz>=2024.1",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sentinel = "sentinel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
