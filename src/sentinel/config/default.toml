[detector]
metric_id = "opened_issues_per_hour"
kind = "issue"
bucket_minutes = 60
baseline_buckets = 6
minimum_baseline_buckets = 4
z_score_threshold = 4.0
standard_deviation_floor = 0.5
volume_floor = 3
minimum_absolute_increase = 2.0
cooldown_buckets = 2

[detector.meta_equals]
action = "opened"
