<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0c0d">
    <meta name="description" content="Sentinel detects public breakage, explains it, and publishes its misses.">
    <meta property="og:title" content="Sentinel · An anomaly detector that grades itself in public">
    <meta property="og:description" content="Replay the webpack v5.99.0 incident, inspect Sentinel's frozen detector studies, or run a live archive hour.">
    <meta property="og:image" content="{{ request.base_url }}static/og.png">
    <title>{{ title }}</title>
    <link rel="icon" href="{{ url_for('static', path='/favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="wordmark" href="/replay/webpack" aria-label="Sentinel replay">
        <span class="wordmark-mark" aria-hidden="true"></span>
        SENTINEL
      </a>
      <nav aria-label="Primary navigation">
        <a href="/replay/webpack" {% if active == 'replay' %}aria-current="page"{% endif %}>Replay</a>
        <a href="/scorecard" {% if active == 'scorecard' %}aria-current="page"{% endif %}>Scorecard</a>
        <a href="/live" {% if active == 'live' %}aria-current="page"{% endif %}>Live</a>
      </nav>
      <span class="system-state"><i></i> source online</span>
    </header>
    <main id="main">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <span>Sentinel / public-data anomaly detection</span>
      <span>UTC throughout · evidence before inference</span>
    </footer>
  </body>
</html>
